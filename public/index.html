<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT 数据可视化监控面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f0f4f8;
      color: #1f2d3d;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; color: #0b7a5c; }
    .header .topic {
      font-size: 13px;
      color: #5a6b7b;
      background: #e3edf7;
      padding: 6px 12px;
      border-radius: 14px;
    }
    .cards { display: flex; gap: 16px; margin-bottom: 20px; }
    .card {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(15, 60, 90, 0.08);
    }
    .card .label { font-size: 13px; color: #7a8a9a; margin-bottom: 6px; }
    .card .value { font-size: 30px; font-weight: 700; }
    .card .value small { font-size: 15px; font-weight: 400; color: #7a8a9a; }
    .card .unit { font-size: 14px; color: #7a8a9a; }
    #tempCard .value { color: #e0553c; }
    #humiCard .value { color: #1e7fd4; }
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(15, 60, 90, 0.08);
      margin-bottom: 20px;
    }
    .panel h2 { font-size: 16px; color: #34506b; margin-bottom: 12px; }
    #chartWrap { position: relative; width: 100%; height: 320px; }
    canvas { width: 100%; height: 100%; display: block; }
    .legend { font-size: 13px; color: #5a6b7b; margin-top: 8px; }
    .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #e8eef4; }
    th { color: #7a8a9a; font-weight: 600; }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: #ffe9d8;
      color: #b4551c;
    }
    .status.on { background: #d9f2e6; color: #0b7a5c; }
  </style>
</head>
<body>
  <div class="header">
    <h1>IoT 数据可视化监控面板</h1>
    <span class="topic" id="topicLabel">topic: 加载中…</span>
  </div>

  <div class="cards">
    <div class="card" id="tempCard">
      <div class="label">当前温度</div>
      <div class="value"><span id="tempVal">--</span><small> ℃</small></div>
      <div class="unit" id="tempDev">--</div>
    </div>
    <div class="card" id="humiCard">
      <div class="label">当前湿度</div>
      <div class="value"><span id="humiVal">--</span><small> %</small></div>
      <div class="unit" id="humiDev">--</div>
    </div>
    <div class="card">
      <div class="label">数据点数</div>
      <div class="value"><span id="countVal">0</span></div>
      <div class="unit">最近 60 条</div>
    </div>
    <div class="card">
      <div class="label">连接状态</div>
      <div class="value"><span class="status" id="connStatus">--</span></div>
      <div class="unit" id="lastTime">--</div>
    </div>
  </div>

  <div class="panel">
    <h2>温湿度变化曲线</h2>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
    <div class="legend">
      <span><span class="dot" style="background:#e0553c;"></span>温度 (℃)</span>
      &nbsp;&nbsp;
      <span><span class="dot" style="background:#1e7fd4;"></span>湿度 (%)</span>
    </div>
  </div>

  <div class="panel">
    <h2>最新数据记录</h2>
    <table>
      <thead>
        <tr><th>时间</th><th>设备</th><th>温度 (℃)</th><th>湿度 (%)</th></tr>
      </thead>
      <tbody id="dataRows">
        <tr><td colspan="4">等待数据…</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const MAX_POINTS = 60;
    let data = [];

    const fmtTime = (ts) => {
      const d = new Date(ts);
      const p = (n) => (n < 10 ? "0" + n : "" + n);
      return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    };

    // 用 Canvas 绘制温湿度曲线（无外部依赖，离线可用）
    function drawChart() {
      const canvas = document.getElementById("chart");
      const wrap = document.getElementById("chartWrap");
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth, h = wrap.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);

      if (data.length < 2) {
        ctx.fillStyle = "#9aa8b6";
        ctx.font = "14px Microsoft YaHei";
        ctx.textAlign = "center";
        ctx.fillText("正在等待 MQTT 数据…", w / 2, h / 2);
        ctx.textAlign = "left";
        return;
      }

      const padL = 48, padR = 16, padT = 14, padB = 30;
      const plotW = w - padL - padR, plotH = h - padT - padB;

      // 纵轴范围
      let tMin = Infinity, tMax = -Infinity, huMin = Infinity, huMax = -Infinity;
      data.forEach((d) => {
        const t = parseFloat(d.temperature), hu = parseFloat(d.humidity);
        if (!isNaN(t)) { tMin = Math.min(tMin, t); tMax = Math.max(tMax, t); }
        if (!isNaN(hu)) { huMin = Math.min(huMin, hu); huMax = Math.max(huMax, hu); }
      });
      tMin = Math.floor((tMin - 1) / 2) * 2; tMax = Math.ceil((tMax + 1) / 2) * 2;
      huMin = Math.floor((huMin - 2) / 5) * 5; huMax = Math.ceil((huMax + 2) / 5) * 5;
      const T = (v) => padT + plotH - ((v - tMin) / (tMax - tMin || 1)) * plotH;
      const H = (v) => padT + plotH - ((v - huMin) / (huMax - huMin || 1)) * plotH;
      const X = (i) => padL + (i / (data.length - 1)) * plotW;

      // 网格与坐标轴
      ctx.strokeStyle = "#e8eef4"; ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padT + (i / 4) * plotH;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      }
      ctx.strokeStyle = "#c6d2de";
      ctx.beginPath();
      ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(w - padR, padT + plotH);
      ctx.stroke();

      ctx.fillStyle = "#7a8a9a"; ctx.font = "11px Microsoft YaHei"; ctx.textAlign = "right";
      ctx.fillText(tMax.toFixed(0) + "℃", padL - 6, padT + 4);
      ctx.fillText(tMin.toFixed(0) + "℃", padL - 6, padT + plotH + 4);
      ctx.fillText(huMax.toFixed(0) + "%", w - padR + 6, padT + 4);
      ctx.fillText(huMin.toFixed(0) + "%", w - padR + 6, padT + plotH + 4);

      // 时间刻度（取约 5 个点）
      ctx.textAlign = "center";
      for (let i = 0; i < data.length; i += Math.max(1, Math.floor(data.length / 5))) {
        ctx.fillText(fmtTime(data[i].receivedAt), X(i), padT + plotH + 16);
      }
      ctx.textAlign = "left";

      // 折线
      const line = (vals, yFn, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = "round";
        ctx.beginPath();
        let started = false;
        data.forEach((d, i) => {
          const v = parseFloat(d[vals]);
          if (isNaN(v)) return;
          const x = X(i), y = yFn(v);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        });
        ctx.stroke();
        // 数据点
        data.forEach((d, i) => {
          const v = parseFloat(d[vals]);
          if (isNaN(v)) return;
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(X(i), yFn(v), 2.5, 0, Math.PI * 2); ctx.fill();
        });
      };
      line("temperature", T, "#e0553c");
      line("humidity", H, "#1e7fd4");
    }

    function render() {
      const latest = data[data.length - 1];
      document.getElementById("countVal").textContent = data.length;
      if (latest) {
        document.getElementById("tempVal").textContent = latest.temperature;
        document.getElementById("humiVal").textContent = latest.humidity;
        document.getElementById("tempDev").textContent = latest.deviceId;
        document.getElementById("humiDev").textContent = latest.deviceId;
        document.getElementById("lastTime").textContent = fmtTime(latest.receivedAt);
        const st = document.getElementById("connStatus");
        st.textContent = "在线"; st.className = "status on";
      }
      const rows = document.getElementById("dataRows");
      rows.innerHTML = "";
      data.slice(-10).reverse().forEach((d) => {
        const tr = document.createElement("tr");
        const cells = [
          fmtTime(d.receivedAt), d.deviceId, d.temperature + " ℃", d.humidity + " %",
        ];
        cells.forEach((c) => {
          const td = document.createElement("td");
          td.textContent = c; tr.appendChild(td);
        });
        rows.appendChild(tr);
      });
      if (data.length === 0) {
        rows.innerHTML = "<tr><td colspan='4'>等待数据…</td></tr>";
      }
      drawChart();
    }

    async function poll() {
      try {
        const res = await fetch("/api/data");
        data = await res.json();
        if (data.length > MAX_POINTS) data = data.slice(-MAX_POINTS);
      } catch (e) { /* 忽略瞬时错误 */ }
      render();
    }

    document.getElementById("topicLabel").textContent =
      "topic: iot/demo/temperature";
    poll();
    setInterval(poll, 1000);
    window.addEventListener("resize", drawChart);
  </script>
</body>
</html>
